[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overseer-local"
version = "0.1.0"
description = "Local resource manager for service health, asset checkout, maintenance, security, and usage-limit coordination."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.11",
  "starlette>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
overseer = "overseer.cli:main"
overseer-codex-usage-mcp = "overseer.codex_usage_mcp:main"
overseer-quark-scheduler = "overseer.quark_scheduler_cli:main"
overseer-backup-provisioning = "overseer.backup_provisioning_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "live_agent: opt-in disposable live provider checks",
]
